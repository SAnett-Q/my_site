<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./find.css" />
</head>
<body>
    <div class="wrapper">
        <div class="top">
            <img src="./img/photo_2026-09-26_20-18-04.jpg" id="ruler" alt="ruler">
            <img src="./img/photo_2026-09-26_20-18-33.jpg" id="pencil" alt="pencil">
            <img src="./img/photo_2026-09-26_20-18-45.jpg" id="pen" alt="pen">
        </div>
        <div class="bottom">
            <button class="btn pe" data-word="pen">pe</button>
            <button class="btn n" data-word="pen">n</button>
            <button class="btn pen" data-word="pencil">pen</button>
            <button class="btn cil" data-word="pencil">cil</button>
            <button class="btn ru" data-word="ruler">ru</button>
            <button class="btn ler" data-word="ruler">ler</button>
        </div>
    </div>
    <script src="./find.js"></script>
</body>
</html>
